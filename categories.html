<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myntra Appliqué · Categories Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Official Myntra Appliqué Design System Tokens */
      --applique-primary: #ff3f6c;
      --applique-primary-hover: #e01e52;
      --applique-primary-light: #fff0f5;
      --applique-text-primary: #282c3f;
      --applique-text-secondary: #535766;
      --applique-text-subdued: #94969f;
      --applique-border-default: #d4d5d9;
      --applique-border-light: #eaeaec;
      --applique-bg-page: #f5f5f6;
      --applique-bg-card: #ffffff;
      --applique-radius-xs: 4px;
      --applique-radius-sm: 8px;
      --applique-radius-md: 12px;
      --applique-radius-full: 9999px;
      --applique-shadow-sm: 0 2px 8px rgba(40, 44, 63, 0.06);
      --applique-shadow-md: 0 8px 24px rgba(40, 44, 63, 0.10);
      --font-applique: 'Assistant', 'Roboto', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #181b22;
      color: var(--applique-text-primary);
      font-family: var(--font-applique);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 8px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #252a36;
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--applique-radius-md);
      font-size: 12px;
    }
    .top-bar strong { color: var(--applique-primary); font-weight: 800; }
    .top-bar a { color: #fff; text-decoration: none; font-weight: 700; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: var(--applique-radius-full); }

    .phone-frame {
      width: 100%;
      max-width: 420px;
      background: var(--applique-bg-card);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.5), 0 0 0 12px #2b2e38, 0 0 0 14px #1c1e24;
      display: flex;
      flex-direction: column;
      height: 890px;
    }

    .ios-status-bar {
      height: 44px;
      background: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 700;
      color: #111;
      flex-shrink: 0;
    }
    .dynamic-island {
      width: 110px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 9px;
    }

    .header-bar {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f2;
      background: #ffffff;
      flex-shrink: 0;
    }
    .header-bar h2 { font-size: 16px; font-weight: 900; }
    .header-bar a { color: var(--applique-primary); font-size: 18px; text-decoration: none; font-weight: 900; }

    /* Category Layout: Left Rail + Right Content */
    .cat-layout {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #f5f5f6;
    }
    .cat-sidebar {
      width: 105px;
      background: #ebebee;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .side-item {
      padding: 14px 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--applique-text-secondary);
      border-bottom: 1px solid #dedee2;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      transition: all 0.15s;
    }
    .side-item.active {
      background: #ffffff;
      color: var(--applique-primary);
      border-left: 4px solid var(--applique-primary);
    }
    .side-icon { font-size: 18px; }

    .cat-main {
      flex: 1;
      background: #ffffff;
      overflow-y: auto;
      padding: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .cat-hero-tag {
      background: linear-gradient(135deg, #20242e, #2e3444);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cat-product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cat-card {
      background: #fafafc;
      border: 1px solid var(--applique-border-light);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 10px;
      position: relative;
    }
    .cat-card img {
      width: 75px;
      height: 95px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
      flex-shrink: 0;
    }
    .cat-card-info { flex: 1; display: flex; flex-direction: column; }
    .cat-card-brand { font-size: 12px; font-weight: 800; }
    .cat-card-name { font-size: 11px; color: var(--applique-text-secondary); margin-top: 1px; }
    .cat-card-price { font-size: 13px; font-weight: 900; margin-top: 4px; }
    .cat-card-occasion {
      font-size: 9.5px;
      font-weight: 800;
      color: #6c47ff;
      background: #f4f0ff;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
      align-self: flex-start;
    }
    .cat-wish-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #ddd;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 13px;
    }
    .cat-wish-btn.active { color: var(--applique-primary); border-color: var(--applique-primary); }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: #ffffff;
      border-top: 1px solid var(--applique-border-light);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 12px;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--applique-text-subdued);
      text-decoration: none;
    }
    .nav-item.active { color: var(--applique-primary); }
    .nav-icon { font-size: 17px; }

    .ios-home-bar {
      width: 130px;
      height: 4.5px;
      background: #111;
      border-radius: var(--applique-radius-full);
      margin: 4px auto 2px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 60px;
      background: #20242e;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--applique-radius-full);
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      z-index: 200;
    }
    .toast.show { display: flex; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div><strong>Appliqué Categories:</strong> Live Add-to-Wishlist</div>
    <a href="prototype.html">🎯 Open Bingo →</a>
  </div>

  <div class="phone-frame">
    <div class="ios-status-bar">
      <span>9:41</span>
      <div class="dynamic-island"></div>
      <div>5G 📶 🔋</div>
    </div>

    <header class="header-bar">
      <h2>CATEGORIES</h2>
      <a href="prototype.html" title="Wishlist">❤️</a>
    </header>

    <div class="cat-layout">
      <!-- Left Sidebar -->
      <aside class="cat-sidebar">
        <div class="side-item active" onclick="selectDepartment('women', this)">
          <span class="side-icon">👗</span>
          <span>Women</span>
        </div>
        <div class="side-item" onclick="selectDepartment('men', this)">
          <span class="side-icon">👔</span>
          <span>Men</span>
        </div>
        <div class="side-item" onclick="selectDepartment('beauty', this)">
          <span class="side-icon">💄</span>
          <span>Beauty</span>
        </div>
        <div class="side-item" onclick="selectDepartment('footwear', this)">
          <span class="side-icon">👠</span>
          <span>Footwear</span>
        </div>
        <div class="side-item" onclick="selectDepartment('luxury', this)">
          <span class="side-icon">✨</span>
          <span>Luxe</span>
        </div>
      </aside>

      <!-- Right Main Content -->
      <main class="cat-main">
        <div class="cat-hero-tag">
          <span id="depTitle">✨ Women's Curation</span>
          <span style="font-size:9.5px;color:#a5b4fc">BINGO CLUSTERING ENABLED</span>
        </div>

        <div class="cat-product-list" id="catList"></div>
      </main>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item" href="home.html">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a class="nav-item active" href="categories.html">
        <span class="nav-icon" style="color:var(--applique-primary)">🪟</span>
        <span>Categories</span>
      </a>
      <a class="nav-item" href="prototype.html">
        <span class="nav-icon">✨</span>
        <span>Studio</span>
      </a>
      <a class="nav-item" href="prototype.html">
        <span class="nav-icon">🎯</span>
        <span>Bingo</span>
      </a>
      <a class="nav-item" href="prototype.html">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
    <div class="ios-home-bar"></div>
  </div>

  <div class="toast" id="toast">
    <span>✨</span>
    <span id="toastMsg">Added to Wishlist!</span>
  </div>

  <script>
    const departments = {
      women: [
        { brand: 'Zara', name: 'Floral Print V-Neck Midi Dress', price: '₹1,499', occasion: '🌴 Resort Vacation', img: 'https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Mango', name: 'Structured Single-Breasted Blazer', price: '₹2,499', occasion: '💼 Monday Office', img: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Biba', name: 'Embroidered Silk Anarkali Set', price: '₹2,199', occasion: '✨ Destination Wedding', img: 'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Forever New', name: 'Pastel Smocked Top', price: '₹1,899', occasion: '☕ Sunday Brunch', img: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=300&q=80', wishlisted: false }
      ],
      men: [
        { brand: 'Tommy Hilfiger', name: 'Solid Pure Linen Formal Shirt', price: '₹2,199', occasion: '💼 Client Meetings', img: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=300&q=80', wishlisted: false },
        { brand: 'Levi\'s', name: '511 Dark Clean Indigo Jeans', price: '₹2,299', occasion: '☕ Weekend Casual', img: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Park Avenue', name: 'Charcoal Tailored Pure Wool Blazer', price: '₹4,999', occasion: '💼 Client Meetings', img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=300&q=80', wishlisted: false }
      ],
      beauty: [
        { brand: 'Nykaa Beauty', name: 'Matte Liquid Lipstick & Highlighter', price: '₹799', occasion: '💃 Reception Party', img: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=300&q=80', wishlisted: false },
        { brand: 'Forest Essentials', name: 'Mysore Sandalwood Body Mist', price: '₹1,450', occasion: '☕ Mehendi Morning', img: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=300&q=80', wishlisted: false }
      ],
      footwear: [
        { brand: 'Nike', name: 'Air Max SC Lightweight Sneakers', price: '₹4,495', occasion: '🏃‍♂️ Gym & Active', img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300&q=80', wishlisted: false },
        { brand: 'Birkenstock', name: 'Arizona Birko-Flor Cork Slides', price: '₹4,490', occasion: '☕ Sunday Brunch', img: 'https://images.unsplash.com/photo-1603808033192-082d6919d3e1?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Clarks', name: 'Pure Tone Black Leather Loafers', price: '₹2,899', occasion: '💼 Monday Office', img: 'https://images.unsplash.com/photo-1533867617858-e7b97e060509?auto=format&fit=crop&w=300&q=80', wishlisted: true }
      ],
      luxury: [
        { brand: 'Fossil', name: 'Jacqueline Rose Gold Mesh Watch', price: '₹4,995', occasion: '💼 Monday Office', img: 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=300&q=80', wishlisted: true },
        { brand: 'Swarovski', name: 'Sparkling Solitaire Drop Earrings', price: '₹4,290', occasion: '🍸 Friday Cocktail', img: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=300&q=80', wishlisted: true }
      ]
    };

    const params = new URLSearchParams(window.location.search);
    const personaId = params.get('persona') || localStorage.getItem('myntra_active_persona') || '1';
    localStorage.setItem('myntra_active_persona', personaId);

    // Update all navigation links
    const topBingo = document.querySelector('.top-bar a');
    if (topBingo) topBingo.href = 'prototype.html?persona=' + personaId;
    const headerHeart = document.querySelector('.header-bar a');
    if (headerHeart) headerHeart.href = 'prototype.html?persona=' + personaId;
    const bottomBingo = document.querySelector('.bottom-nav a[href="prototype.html"]');
    if (bottomBingo) bottomBingo.href = 'prototype.html?persona=' + personaId;
    const bottomHome = document.querySelector('.bottom-nav a[href="home.html"]');
    if (bottomHome) bottomHome.href = 'home.html?persona=' + personaId;

    function renderDepartment(dep) {
      const list = document.getElementById('catList');
      const items = departments[dep] || departments.women;
      list.innerHTML = items.map(p => `
        <article class="cat-card">
          <img src="${p.img}" alt="${p.name}" loading="lazy">
          <button class="cat-wish-btn ${p.wishlisted ? 'active' : ''}" onclick="toggleCatWishlist(this, '${p.brand} ${p.name}', '${p.occasion}')">
            ${p.wishlisted ? '❤️' : '🤍'}
          </button>
          <div class="cat-card-info">
            <div class="cat-card-brand">${p.brand}</div>
            <div class="cat-card-name">${p.name}</div>
            <div class="cat-card-price">${p.price}</div>
            <div class="cat-card-occasion">✨ ${p.occasion}</div>
          </div>
        </article>
      `).join('');
    }

    renderDepartment('women');

    function selectDepartment(dep, el) {
      document.querySelectorAll('.side-item').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('depTitle').textContent = '✨ ' + dep.toUpperCase() + ' CURATION';
      renderDepartment(dep);
    }

    function toggleCatWishlist(btn, name, occasion) {
      const isNow = !btn.classList.contains('active');
      if (isNow) {
        btn.classList.add('active');
        btn.textContent = '❤️';
        showToast('✨ Added ' + name + ' to Wishlist! Clustered into "' + occasion + '"');
      } else {
        btn.classList.remove('active');
        btn.textContent = '🤍';
        showToast('Removed from Wishlist');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }
  </script>
</body>
</html>

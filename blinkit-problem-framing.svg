<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#fbfbfc"/>
<style>
.title{font:800 28px Inter,Arial,sans-serif;fill:#20201c;letter-spacing:-0.5px}
.brand{font:900 32px Inter,Arial,sans-serif;fill:#ff3f6c;letter-spacing:-1px}
.tagline{font:700 11px Inter,Arial,sans-serif;fill:#6d6d66;text-transform:uppercase;letter-spacing:1.2px}
.head{font:800 16px Inter,Arial,sans-serif;fill:#ff3f6c;letter-spacing:-0.2px}
.body{font:14px Inter,Arial,sans-serif;fill:#29303e;line-height:1.45}
.nav-text{font:700 8.5px Inter,Arial,sans-serif;fill:#29303e}
.pill{font:700 10px Inter,Arial,sans-serif;fill:#087852}
</style>

<!-- Header -->
<text x="32" y="44" class="title">Wishlist Hesitation Halts Conversion Before Checkout on Myntra</text>
<text x="32" y="62" class="tagline">North Star: 30-Day Wishlist-to-Purchase Conversion · Constraint: Zero Monetary Incentives</text>
<line x1="32" y1="74" x2="1248" y2="74" stroke="#e5e4dc" stroke-width="1.2"/>
<text x="1100" y="46" class="brand">Myntra</text>
<rect x="1212" y="27" width="36" height="20" rx="10" fill="#fff0f5"/>
<text x="1230" y="41" font-family="Inter,Arial" font-size="10" font-weight="800" fill="#ff3f6c" text-anchor="middle">VOC</text>

<!-- 6 PM Framework Cards -->
<g stroke="#e5e4dc" stroke-width="1">
  <!-- Top Row -->
  <rect x="32" y="88" width="392" height="236" rx="14" fill="#ffffff"/>
  <rect x="444" y="88" width="392" height="236" rx="14" fill="#ffffff"/>
  <rect x="856" y="88" width="392" height="236" rx="14" fill="#ffffff"/>

  <!-- Bottom Row -->
  <rect x="32" y="338" width="392" height="248" rx="14" fill="#ffffff"/>
  <rect x="444" y="338" width="392" height="248" rx="14" fill="#ffffff"/>
  <rect x="856" y="338" width="392" height="248" rx="14" fill="#ffffff"/>
</g>

<!-- Card 1: What Is the True Problem? -->
<rect x="32" y="88" width="392" height="5" rx="2" fill="#ff3f6c"/>
<text x="50" y="116" class="head">1. What Is the True Problem?</text>
<text x="50" y="142" class="body">
  <tspan x="50" dy="0">Users browse and save fashion items to wishlists</tspan>
  <tspan x="50" dy="19">(expressing strong intent) but stop short of buying.</tspan>
  <tspan x="50" dy="25">Hesitation is driven by size &amp; fit uncertainty,</tspan>
  <tspan x="50" dy="19">fabric quality doubts, out-of-stock sizes, clutter</tspan>
  <tspan x="50" dy="19">(forgetting saved items), and delivery fees.</tspan>
  <tspan x="50" dy="25">Key Constraint: We cannot offer monetary discounts</tspan>
  <tspan x="50" dy="19">or coupons. Solutions must be 100% product-led.</tspan>
</text>

<!-- Card 2: Who Faces the Problem? -->
<rect x="444" y="88" width="392" height="5" rx="2" fill="#f28c28"/>
<text x="462" y="116" class="head">2. Who Faces the Problem?</text>
<text x="462" y="142" class="body">
  <tspan x="462" dy="0">High-Intent Wishlist Accumulators: Myntra users</tspan>
  <tspan x="462" dy="19">with 10+ items saved in their wishlist over 30 days</tspan>
  <tspan x="462" dy="19">with zero wishlist-to-cart conversions.</tspan>
  <tspan x="462" dy="25">They treat wishlists as holding carts or style</tspan>
  <tspan x="462" dy="19">moodboards, but lack confidence cues (fit, styling,</tspan>
  <tspan x="462" dy="19">or fabric feel) needed to pull the trigger.</tspan>
  <tspan x="462" dy="25">Recommended target for 5–6 qualitative user interviews.</tspan>
</text>

<!-- Card 3: How Do We Know It's Real? -->
<rect x="856" y="88" width="392" height="5" rx="2" fill="#087852"/>
<text x="874" y="116" class="head">3. How Do We Know It’s Real?</text>
<text x="874" y="142" class="body">
  <tspan x="874" dy="0">Scaled VoC evidence from 20,703 public reviews</tspan>
  <tspan x="874" dy="19">across Google Play India, App Store, &amp; Reddit.</tspan>
  <tspan x="874" dy="25">2,508 in-scope friction signals validated by AI:</tspan>
  <tspan x="874" dy="19">• Fit &amp; Fabric Anxiety: 2,252 signals (sizing doubts)</tspan>
  <tspan x="874" dy="19">• Wishlist Clutter: 181 signals (lost/forgotten items)</tspan>
  <tspan x="874" dy="19">• Delivery Friction: 91 signals (charges at checkout)</tspan>
  <tspan x="874" dy="19">• Styling Doubts: 89 signals (how to wear/match)</tspan>
</text>

<!-- Card 4: Value to the Customer -->
<rect x="32" y="338" width="392" height="5" rx="2" fill="#ff3f6c"/>
<text x="50" y="366" class="head">4. Value to the Customer</text>
<text x="50" y="394" class="body">
  <tspan x="50" dy="0">• Buying Confidence: Fit badges (% true-to-size)</tspan>
  <tspan x="50" dy="19">  and customer photos directly on wishlist cards.</tspan>
  <tspan x="50" dy="25">• Clutter-Free Curation: Smart Folders group items</tspan>
  <tspan x="50" dy="19">  by occasion (e.g. Workwear, Vacation, Festive).</tspan>
  <tspan x="50" dy="25">• Stock Peace of Mind: Real-time size-restock alerts</tspan>
  <tspan x="50" dy="19">  and identical in-stock alternative recommendations.</tspan>
</text>

<!-- Card 5: Value to the Business -->
<rect x="444" y="338" width="392" height="5" rx="2" fill="#087852"/>
<text x="462" y="366" class="head">5. Value to the Business</text>
<text x="462" y="394" class="body">
  <tspan x="462" dy="0">• Accelerates North Star: Increases 30-day wishlist</tspan>
  <tspan x="462" dy="19">  checkout rate without discounting or margins loss.</tspan>
  <tspan x="462" dy="25">• Unlocks High Latent GMV: Activates millions of</tspan>
  <tspan x="462" dy="19">  dormant items currently sitting idle in wishlists.</tspan>
  <tspan x="462" dy="25">• Lowers Return Rates: Accurate pre-purchase fit</tspan>
  <tspan x="462" dy="19">  confidence reduces reverse logistics costs.</tspan>
</text>

<!-- Card 6: Why Solve This Now? -->
<rect x="856" y="338" width="392" height="5" rx="2" fill="#29303e"/>
<text x="874" y="366" class="head">6. Why Solve This Now?</text>
<text x="874" y="394" class="body">
  <tspan x="874" dy="0">• Wishlisting is high-intent, but customer attention</tspan>
  <tspan x="874" dy="19">  decays fast after 7–14 days of inactivity.</tspan>
  <tspan x="874" dy="25">• Margin pressures require non-monetary growth:</tspan>
  <tspan x="874" dy="19">  improving UX/trust converts users organically.</tspan>
  <tspan x="874" dy="25">• Automated data pipeline is live; immediate next</tspan>
  <tspan x="874" dy="19">  step is 5–6 primary interviews to validate solutions.</tspan>
</text>

